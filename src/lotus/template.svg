<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    @media (max-aspect-ratio: 1/1) {
      .tint {
        display: none;
      }
    }
  </style>

  <defs>
    <pattern id="dust" width="150" height="150" patternUnits="userSpaceOnUse">
      <image xlink:href="{{dust}}" width="150" height="150" />
    </pattern>

    <linearGradient id="tint" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0.67" stop-color="darkslategray" stop-opacity="0" />
      <stop offset="1" stop-color="darkslategray" />
    </linearGradient>

    <radialGradient id="red" r="0.7">
      <stop offset="0" stop-color="#ddd" />
      <stop offset="0.25" stop-color="#ccc" />
      <stop offset="1" stop-color="saddlebrown" />
    </radialGradient>

    <radialGradient id="blue" r="0.7">
      <stop offset="0" stop-color="dodgerblue" />
      <stop offset="0.5" stop-color="turquoise" />
      <stop offset="1" stop-color="slateblue" />
    </radialGradient>

    <radialGradient id="red-fallback" r="0.7">
      <stop offset="0.05" stop-color="white" />
      <stop offset="0.67" stop-color="rgb(255, 100, 0)" stop-opacity="0.5" />
    </radialGradient>

    <radialGradient id="blue-fallback" r="0.7">
      <stop offset="0" stop-color="dodgerblue" stop-opacity="0.35" />
      <stop offset="0.5" stop-color="aquamarine" />
      <stop offset="1" stop-color="blue" stop-opacity="0.35" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="black" />

  <svg width="100%" height="100%" viewBox="0 0 1706.67 960" preserveAspectRatio="xMinYMin slice">
    <image xlink:href="{{room}}" width="1706.67" height="960" />
    <image xlink:href="{{glow}}" width="1706.67" height="960" />
    <image xlink:href="{{paper}}" width="1706.67" height="960" opacity="0.5" />
  </svg>

  <rect width="100%" height="100%" fill="url(#dust)" style="mix-blend-mode: exclusion" />
  <rect
    class="tint"
    width="100%"
    height="100%"
    fill="url(#tint)"
    style="mix-blend-mode: exclusion" />
  <rect width="100%" height="100%" fill="{{wash}}" style="mix-blend-mode: hard-light" />
</svg>
